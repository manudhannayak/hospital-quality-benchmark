# Scheduled refresh: CMS updates Care Compare data roughly quarterly, so check monthly.
# The warehouse history is committed back to the repo so release-over-release alerts work.
name: CMS benchmark refresh

on:
  schedule:
    - cron: "17 13 3 * *"   # 3rd of every month, 13:17 UTC (6:17 AM Arizona)
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Tests
        run: PYTHONPATH=src pytest -q

      - name: Run pipeline (live CMS pull)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: PYTHONPATH=src python -m hqb.pipeline --source cms

      - name: Upload report and Power BI extracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_number }}
          path: |
            output/benchmark_report.html
            output/powerbi/
            output/dq_results.json
            output/facts.json

      # docs/ is served by GitHub Pages, so committing it republishes the live dashboard.
      - name: Publish dashboard + commit warehouse history
        run: |
          git config user.name "bi-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ && git add -f output/warehouse.db output/powerbi
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "CMS refresh $(date +%F): dashboard republished" && git push; fi
